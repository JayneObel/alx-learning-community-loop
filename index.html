<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Learning to Community Loop: prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F8FB; --bg2: #F3F4F7; --card: #FFFFFF; --ink: #16213D; --muted: #68728A; --line: #D8DEEA; --soft: #ECEFFA;
    --navy: #0B1F45; --purple: #5A38D6; --purple-text: #5A38D6; --green: #1FA46B; --yellow: #FFC93C;
    --blue: #2F80C9; --red: #C94A4A; --circle-blue: #3A78A6; --circle-purple: #4B45C7; --dark-card: #0B1F45;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1326; --bg2: #101830; --card: #172039; --ink: #EDF0F8; --muted: #9DA8C4; --line: #2A3556; --soft: #202B4A;
      --purple-text: #A996FF; --green: #2CC486; --blue: #6AAEE8; --dark-card: #0A1330;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1326; --bg2: #101830; --card: #172039; --ink: #EDF0F8; --muted: #9DA8C4; --line: #2A3556; --soft: #202B4A;
    --purple-text: #A996FF; --green: #2CC486; --blue: #6AAEE8; --dark-card: #0A1330;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.5; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

  /* Prototype controls (not part of the product) */
  .pbar { background: #0B1F45; color: #fff; display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; }
  .pbar b { font-weight: 600; font-size: 13px; color: #C7D0EA; }
  .steps { display: flex; gap: 6px; flex: 1; overflow-x: auto; }
  .steps button { background: transparent; color: #C7D0EA; border: 1px solid transparent; border-radius: 8px; padding: 6px 12px; white-space: nowrap; font-weight: 500; font-size: 13px; }
  .steps button[aria-current="true"] { background: #5A38D6; color: #fff; font-weight: 600; }
  .steps button:hover { border-color: #3A4A78; }
  .reset { background: transparent; color: #C7D0EA; border: 1px solid #3A4A78; border-radius: 8px; padding: 5px 12px; font-size: 13px; }

  /* Shared */
  .logo { font-weight: 800; font-size: 26px; letter-spacing: -0.04em; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
  .av.sm { width: 32px; height: 32px; font-size: 12px; background: #2B2B7A; color: #fff; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.015em; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }
  .note { color: var(--muted); font-size: 13px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .tag { background: var(--navy); color: #fff; border-radius: 8px; padding: 4px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tag.yellow { background: var(--yellow); color: #16213D; }
  .tag.purple { background: var(--purple); color: #fff; }
  .tag.green { background: var(--green); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
  .card.dark { background: var(--dark-card); border-color: var(--dark-card); color: #fff; }
  .card.dark .note { color: #B9C3E0; }
  .btn { background: var(--circle-purple); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; }
  .btn.navy { background: var(--navy); }
  .btn.ghost { background: transparent; color: #fff; border: 1px dashed #4A5A8A; font-weight: 500; font-size: 13px; }
  .btn.done { background: var(--green); }
  .btn.dark { background: #16213D; }
  .checks { list-style: none; padding: 0; margin: 0 0 16px; }
  .checks li { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .tick { width: 22px; height: 22px; border-radius: 6px; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 13px; flex: none; }
  .tick.empty { background: transparent; border: 2px solid var(--line); color: transparent; }
  .action-row { display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex-wrap: wrap; }
  .action-row .note { flex: 1; min-width: 200px; text-align: right; }
  .two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .num { width: 26px; height: 26px; border-radius: 7px; background: var(--circle-purple); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { display: flex; gap: 12px; align-items: center; padding: 8px 0; }
  .big { font-size: 22px; font-weight: 700; color: var(--yellow); margin: 4px 0 14px; }
  .opt { display: flex; flex-direction: column; gap: 10px; margin: 0; }
  .opt p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
  .opt.chosen { border-color: var(--green); }
  .banner { background: var(--soft); border-radius: 10px; padding: 12px 16px; margin: 16px 0; font-weight: 500; }

  /* eHub */
  .eh { background: var(--card); display: flex; justify-content: space-between; align-items: center; padding: 12px 28px; border-bottom: 1px solid var(--line); }
  .eh-l { display: flex; align-items: baseline; gap: 10px; }
  .eh-l span { font-size: 22px; font-weight: 400; }
  .eh-r { display: flex; align-items: center; gap: 16px; }
  .pts { border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
  .coin { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #F0B429; display: inline-block; }
  .hero { background: linear-gradient(100deg, #4A2FB5 0%, #3B3FC4 55%, #2A55C9 100%); color: #fff; padding: 38px 28px 40px; }
  .hero.compact { padding: 26px 28px 28px; }
  .hero .k { color: #FFC93C; font-weight: 700; font-size: 18px; }
  .hero h2 { font-size: clamp(24px, 4vw, 38px); font-weight: 400; margin: 4px 0 8px; line-height: 1.15; max-width: 20ch; }
  .hero p { margin: 0; font-size: 15px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 28px; }
  .wrap h3 { font-size: 24px; margin: 0 0 14px; }
  .prog { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 28px; }
  .prog h4 { margin: 0 0 4px; font-size: 20px; }
  .btn-o { background: transparent; border: 1px solid var(--blue); color: var(--blue); border-radius: 999px; padding: 8px 28px; font-weight: 600; }
  .btn-o:hover { background: var(--blue); color: #fff; }

  /* Savanna */
  .sv-h { display: flex; gap: 14px; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--card); }
  .sv-h span { font-size: 22px; font-weight: 300; }
  .sv { display: grid; grid-template-columns: 210px 1fr; background: var(--card); min-height: 640px; }
  .sv-side { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sv-side div { padding: 10px 14px; border-radius: 8px; color: var(--ink); font-weight: 500; font-size: 14px; }
  .sv-side .sep { height: 1px; padding: 0; background: var(--line); margin: 8px 6px; border-radius: 0; }
  .sv-side .prof { margin-top: auto; color: var(--red); font-weight: 600; }
  .sv-top { display: flex; gap: 24px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .sv-top .course { font-weight: 600; }
  .sv-top .score { flex: 1; min-width: 200px; }
  .sv-top .score b { font-size: 14px; }
  .bar { height: 6px; background: var(--line); border-radius: 999px; margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--red); }
  .sv-body { display: grid; grid-template-columns: 270px 1fr; gap: 26px; padding: 22px 24px; }
  .sv-main { min-width: 0; }
  .pick { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-weight: 500; }
  .toc { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toc .g { background: var(--soft); padding: 10px 14px; font-weight: 500; }
  .toc .p { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .toc .p.on { background: var(--red); color: #fff; border-color: var(--red); }
  .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--green); }
  .dot.no { border: 2px solid currentColor; opacity: 0.6; }
  .status { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .callout { border: 1px solid var(--blue); background: var(--soft); border-radius: 12px; padding: 20px 22px; }

  /* Community (Circle) */
  .circle { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .cr-top { display: flex; align-items: center; gap: 28px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
  .cr-top nav { display: flex; gap: 6px; flex: 1; justify-content: center; }
  .cr-top nav span { padding: 7px 14px; border-radius: 8px; color: var(--muted); font-weight: 500; }
  .cr-top nav span.on { background: var(--soft); color: var(--ink); }
  .cr-body { display: grid; grid-template-columns: 230px 1fr; background: var(--bg2); }
  .cr-side { padding: 16px; border-right: 1px solid var(--line); background: var(--card); }
  .cr-side .feed { padding: 10px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); }
  .cr-side .feed.on { background: var(--circle-blue); color: #fff; }
  .cr-side h4 { font-size: 14px; margin: 18px 0 6px; }
  .cs { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .cs.on { background: var(--soft); font-weight: 600; }
  .cs em { font-style: normal; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .cs.new em { color: #fff; background: var(--green); border-color: var(--green); }
  .cr-main { padding: 22px; min-width: 0; }

  /* Manager view */
  .metric { margin: 0; }
  .metric .label { font-weight: 600; color: var(--muted); font-size: 13px; }
  .metric .val { font-size: 26px; font-weight: 700; }
  .metric .tgt { font-size: 12px; color: var(--muted); }
  .seg { display: grid; grid-template-columns: 1.3fr 0.8fr 1.6fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
  .seg:first-of-type { border-top: 0; }
  .seg b { font-weight: 600; }
  .seg span.n { color: var(--muted); font-size: 14px; }
  .seg span.a { color: var(--purple-text); font-weight: 600; font-size: 14px; }
  .journey li { display: flex; gap: 12px; align-items: center; padding: 6px 0; }
  .suggest { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--soft); font-size: 14px; }
  .suggest b { display: block; margin-bottom: 2px; }
  .city { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
  .city b { font-weight: 600; }
  .city .hi { color: var(--purple-text); font-weight: 600; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; padding: 12px 0 24px; }

  @media (max-width: 860px) {
    .sv { grid-template-columns: 1fr; }
    .sv-side { display: none; }
    .sv-body { grid-template-columns: 1fr; padding: 16px; }
    .cr-body { grid-template-columns: 1fr; }
    .cr-side { display: none; }
    .two, .three { grid-template-columns: 1fr; }
    .four { grid-template-columns: 1fr 1fr; }
    .seg { grid-template-columns: 1fr 1fr; }
    .seg span.a { grid-column: 1 / -1; }
    .eh, .hero, .wrap { padding-left: 16px; padding-right: 16px; }
    h1 { font-size: 22px; }
    .action-row .note { text-align: left; }
    .cr-top nav { justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="pbar">
  <b>Prototype</b>
  <nav class="steps" id="steps" aria-label="Prototype screens"></nav>
  <button class="reset" data-act="reset">Reset demo</button>
</div>
<div id="app"></div>
<p class="foot">Concept prototype. All names and figures are illustrative.</p>

<script>
  var state = { screen: 1, stage: 'ehub', opened: false, registered: false, attended: false, contribution: null, alumni: null, mgrDone: null, cityDone: false };
  var STEPS = ['Learning milestone', 'Career Exchange', 'Follow up', 'Community Manager view'];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function ehubHeader() {
    return '<header class="eh"><div class="eh-l"><b class="logo">alx</b><span>eHub</span></div>' +
      '<div class="eh-r"><span class="pts"><i class="coin"></i>0 points</span>' +
      '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="currentColor">' +
      [2, 10, 18].map(function (y) { return [2, 10, 18].map(function (x) { return '<circle cx="' + x + '" cy="' + y + '" r="1.8"/>'; }).join(''); }).join('') + '</svg>' +
      '<span class="av">AM</span></div></header>';
  }
  function hero(k, title, sub, compact) {
    return '<section class="hero' + (compact ? ' compact' : '') + '"><div class="k">' + k + '</div><h2>' + title + '</h2><p>' + sub + '</p></section>';
  }

  /* ---------- Screen 1: eHub Learning, then Savanna ---------- */
  function screen1() {
    if (state.stage === 'ehub') {
      return ehubHeader() +
        hero('Your Learning Resources', 'View Your Program and Track Your Progress', 'Find detailed information about your enrolled program here.') +
        '<div class="wrap"><h3>Current Programs</h3>' +
        '<div class="prog"><div><h4>Career Readiness</h4><p class="note" style="margin:0">Self paced. Build your CV and portfolio and get ready for your first role.</p></div>' +
        '<button class="btn-o" data-act="stage:savanna">Continue</button></div>' +
        '<p class="note" style="margin-top:14px">Prototype: click Continue, the way a Learner would to go into Savanna.</p></div>';
    }
    var side = ['Home', 'Access my learning', '-', 'My courses', 'Conference rooms', 'Servers', 'Sandboxes', 'Video on demand', '-', 'Peers'].map(function (t) {
      return t === '-' ? '<div class="sep"></div>' : '<div>' + t + '</div>';
    }).join('') + '<div class="prof">My Profile</div>';
    var pages = [['Why portfolios matter', 1], ['Choosing your projects', 1], ['Writing your CV', 1], ['Portfolio assignment', 0]].map(function (p, i) {
      return '<div class="p' + (i === 3 ? ' on' : '') + '"><span>' + p[0] + '</span><span class="dot ' + (p[1] ? 'ok' : 'no') + '"></span></div>';
    }).join('');
    return '<div class="sv-h"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 6h20M3 13h20M3 20h20"/></svg><b class="logo">alx</b><span>Learning</span></div>' +
      '<div class="sv"><aside class="sv-side">' + side + '</aside><div>' +
      '<div class="sv-top"><div class="course">Career Readiness</div><div class="score"><b>Your Score: 62%</b><div class="bar"><i style="width:62%"></i></div></div></div>' +
      '<div class="sv-body"><div><div class="pick">Career preparation</div><div class="toc"><div class="g">Building your portfolio</div>' + pages + '</div></div>' +
      '<div class="sv-main"><h1>Portfolio assignment</h1>' +
      '<div class="status"><span class="tag">Submitted for review</span><span class="note">A tutor will score it and the result will appear here. You have 2 reviews left.</span></div>' +
      '<div class="callout"><h2>Good work, Amina</h2><p style="margin:0 0 12px">Your next step can happen in Community. Join the Career Exchange to review your CV with Alumni and peers.</p>' +
      '<ul class="checks"><li><span class="tick">&#10003;</span>Get feedback on your CV</li><li><span class="tick">&#10003;</span>Meet Alumni in your field</li><li><span class="tick">&#10003;</span>Save the event to your calendar</li></ul>' +
      '<div class="action-row"><span class="note">On mobile, use the Circle app with your ALX login.</span><button class="btn" data-act="open">Continue to ALX Community</button></div></div>' +
      '</div></div></div></div>';
  }

  /* ---------- Community shell (screens 2 and 3) ---------- */
  function community(active, main) {
    var items = [['Introduce Yourself', '99+'], ['Events', '6'], ['Announcements', '7'], ['Community Corner', '20'], ['Let\u2019s Connect', '99+']].map(function (r) {
      return '<div class="cs' + (active === 'Events' && r[0] === 'Events' ? ' on' : '') + '"><span>' + r[0] + '</span><em>' + r[1] + '</em></div>';
    }).join('');
    var alum = state.alumni ? '<div class="cs new"><span>' + esc(state.alumni) + '</span><em>New</em></div>' : '';
    return ehubHeader() + hero('Your ALX Community', 'Connect With Fellow Learners in Your Community', 'Get peer support and build your professional network.', true) +
      '<div class="wrap"><div class="circle"><div class="cr-top"><b class="logo">alx</b><nav><span class="' + (active === 'Home' ? 'on' : '') + '">Home</span><span class="' + (active === 'Events' ? 'on' : '') + '">Events</span><span>Leaderboard</span></nav><span class="av sm">AM</span></div>' +
      '<div class="cr-body"><aside class="cr-side"><div class="feed' + (active === 'Home' ? ' on' : '') + '">Feed</div><h4>One Community</h4>' + items + '<h4>Alumni Community</h4>' + alum + '</aside>' +
      '<div class="cr-main">' + main + '</div></div></div></div>';
  }

  function screen2() {
    var left = state.registered ? 11 : 12;
    var right = state.registered
      ? '<h2>Your place</h2><div class="big">You are registered</div><p class="note">Thursday 18:00 EAT. After attending, Community suggests one useful next action.</p>' +
        '<button class="btn ghost" data-act="attend" style="margin-top:12px">Prototype control: skip to after the session</button>'
      : '<h2>Your place</h2><div class="big">' + left + ' of 20 places left</div><button class="btn" data-act="register" style="width:100%">Register</button>' +
        '<p class="note" style="margin-top:12px">After attending, Community suggests one useful next action.</p>';
    return community('Events',
      '<div class="head"><div><h1>CV Review and Interview Practice</h1><p class="sub">Learners and Alumni. Nairobi and online. Thursday 18:00 EAT.</p></div><span class="tag yellow">Career</span></div>' +
      '<div class="two"><div class="card"><h2>What happens</h2><ul class="list">' +
      '<li><span class="num">1</span>Small group CV review</li>' +
      '<li><span class="num">2</span>Mock interview with an Alumni volunteer</li>' +
      '<li><span class="num">3</span>One action added to your career plan</li></ul></div>' +
      '<div class="card dark">' + right + '</div></div>');
  }

  /* ---------- Screen 3 ---------- */
  function optionCard(key, title, text, btn) {
    var chosen = state.contribution === key;
    return '<div class="card opt' + (chosen ? ' chosen' : '') + '"><h2 style="margin:0">' + title + '</h2><p>' + text + '</p>' +
      '<button class="btn' + (chosen ? ' done' : ' navy') + '" data-act="contrib:' + key + '">' + (chosen ? 'Chosen' : btn) + '</button></div>';
  }
  function alumniCard(key, title, text) {
    var chosen = state.alumni === key;
    return '<div class="card opt' + (chosen ? ' chosen' : '') + '"><h2 style="margin:0">' + title + '</h2><p>' + text + '</p>' +
      '<button class="btn' + (chosen ? ' done' : ' navy') + '" data-act="alumni:' + key + '">' + (chosen ? 'Selected' : 'Select') + '</button></div>';
  }
  function screen3() {
    if (!state.attended) {
      return community('Home', '<h1>Your next useful action</h1><div class="card"><p class="sub" style="margin:0 0 14px">This appears after Amina attends the Career Exchange.</p><button class="btn" data-act="go:2">Go to the Career Exchange</button></div>');
    }
    var html = '<h1>Your next useful action</h1><p class="sub">Amina attended the Career Exchange. The follow up invites contribution without forcing a post.</p><div class="three">' +
      optionCard('Shared a CV lesson', 'Share one CV lesson', 'Help another Learner avoid a mistake you discovered.', 'Contribute') +
      optionCard('Answered a question', 'Answer one question', 'Respond in your field or ask an Alumni Member to help.', 'Choose') +
      optionCard('Saved a career goal', 'Save your career goal', 'Choose what support you want to receive next.', 'Choose') + '</div>';
    if (state.contribution) {
      html += '<div class="banner">Thanks, Amina. Meaningful contributions can earn existing Rewards points after normal quality checks.</div>' +
        '<h2 style="margin-top:20px">Before you graduate: what should Community help you do next?</h2>' +
        '<p class="sub">Your answer shapes the Alumni spaces, events and opportunities you see after graduation.</p><div class="three">' +
        alumniCard('Find work', 'Find work', 'Jobs, referrals, CV and interview support.') +
        alumniCard('Grow at work', 'Grow at work', 'Industry learning, leadership and professional visibility.') +
        alumniCard('Give back', 'Give back', 'Mentor, host, recruit or support a city initiative.') + '</div>';
      if (state.alumni) html += '<div class="banner">Done. Amina is now set up for Alumni Community: ' + esc(state.alumni.toLowerCase()) + '. It appears in her Community menu.</div>';
    }
    return community('Home', html);
  }

  /* ---------- Screen 4: Community Manager view ---------- */
  function journeyItem(done, text) {
    return '<li><span class="tick' + (done ? '' : ' empty') + '">&#10003;</span><span style="' + (done ? '' : 'color:var(--muted)') + '">' + text + '</span></li>';
  }
  function suggestion() {
    if (!state.opened) return ['Amina has not opened the prompt yet.', 'Send a mobile access reminder.'];
    if (!state.registered) return ['Amina opened Community but has not registered.', 'Send a short reminder about Thursday\u2019s Career Exchange.'];
    if (!state.attended) return ['Amina is registered.', 'Send a reminder the day before the session.'];
    if (!state.contribution) return ['Amina attended but has not contributed yet.', 'Invite one small contribution, such as sharing a CV lesson.'];
    if (!state.alumni) return ['Amina made her first contribution.', 'Offer the Alumni choice as graduation gets closer.'];
    if (state.alumni === 'Give back') return ['Amina chose to give back.', 'Add her to the Alumni list for local sessions and invite her to host.'];
    return ['Amina chose to ' + state.alumni.toLowerCase() + '.', 'Introduce her to an Alumni contact in her field or city.'];
  }
  function nextBlock(s) {
    var done = state.mgrDone === s[1];
    var out = '<div class="suggest"><b>What the Community Manager does next</b>' + esc(s[0]) + ' ' + esc(s[1]) +
      '<div style="margin-top:10px">' + (done
        ? '<span class="tag green">Done</span> <span class="note">In 14 days the view shows whether Amina came back.</span>'
        : '<button class="btn navy" data-act="mgr">Mark as done</button>') + '</div></div>';
    if (state.alumni === 'Give back') {
      out += '<div class="suggest"><b>What the city lead does next</b>Invite Amina to host or support a Career Exchange in her city.' +
        '<div style="margin-top:10px">' + (state.cityDone
          ? '<span class="tag green">Invitation sent</span>'
          : '<button class="btn navy" data-act="city">Send invitation</button>') + '</div></div>';
    }
    return out;
  }
  function screen4() {
    var hosts = 6 + (state.alumni === 'Give back' ? 1 : 0);
    var s = suggestion();
    return ehubHeader() + '<div class="wrap"><div class="head"><h1>Pilot performance and next actions</h1><span class="tag purple">8 week pilot</span></div>' +
      '<div class="four" style="margin:16px 0">' +
      [['Activation', '58%', 'Target 60%'], ['First action', '72%', 'Target 70%'], ['14 day return', '46%', 'Target 50%'], ['Useful response', '81%', 'Target 80%']].map(function (m) {
        return '<div class="card metric"><div class="label">' + m[0] + '</div><div class="val">' + m[1] + '</div><div class="tgt">' + m[2] + '</div></div>';
      }).join('') + '</div><div class="two">' +
      '<div class="card"><h2>Amina\u2019s journey</h2><ul class="list journey">' +
      journeyItem(state.opened, 'Opened Community from the Savanna prompt') +
      journeyItem(state.registered, 'Registered for the Career Exchange') +
      journeyItem(state.attended, 'Attended the session') +
      journeyItem(!!state.contribution, 'Made a first contribution' + (state.contribution ? ' (' + esc(state.contribution) + ')' : '')) +
      journeyItem(!!state.alumni, 'Chose an Alumni next step' + (state.alumni ? ' (' + esc(state.alumni.toLowerCase()) + ')' : '')) +
      '</ul>' + nextBlock(s) + '</div>' +
      '<div class="card dark"><h2>Recommended action</h2><div class="big" style="font-size:18px">14 day return is below target.</div>' +
      '<p style="margin:0;font-size:14px">Send a Circle mobile reminder to newly activated Members who have not returned, then compare return by city.</p></div></div>' +
      '<div class="card"><h2>Priority segments</h2>' +
      [['New but inactive', '84 Members', 'Send mobile access reminder'], ['Questions waiting', '11 posts', 'Assign Ambassador response'], ['Graduating soon', '63 Members', 'Invite Alumni value choice'], ['Career event no show', '29 Members', 'Offer next session']].map(function (r) {
        return '<div class="seg"><b>' + r[0] + '</b><span class="n">' + r[1] + '</span><span class="a">' + r[2] + '</span></div>';
      }).join('') + '</div>' +
      '<div class="card"><h2>City view</h2><div class="city"><span><b>Nairobi</b> 52% return</span><span><b>Kisumu</b> 38% return</span><span>Top topic: CV feedback</span><span class="hi">' + hosts + ' Alumni ready to host</span></div></div></div>';
  }

  function render() {
    document.getElementById('steps').innerHTML = STEPS.map(function (t, i) {
      return '<button data-act="go:' + (i + 1) + '"' + (state.screen === i + 1 ? ' aria-current="true"' : '') + '>' + (i + 1) + '  ' + t + '</button>';
    }).join('');
    document.getElementById('app').innerHTML = [null, screen1, screen2, screen3, screen4][state.screen]();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var a = el.getAttribute('data-act');
    if (a.indexOf('go:') === 0) { state.screen = +a.slice(3); if (state.screen === 1) { state.stage = 'ehub'; } }
    else if (a === 'stage:savanna') { state.stage = 'savanna'; }
    else if (a === 'open') { state.opened = true; state.screen = 2; }
    else if (a === 'register') { state.opened = true; state.registered = true; }
    else if (a === 'attend') { state.opened = true; state.registered = true; state.attended = true; state.screen = 3; }
    else if (a.indexOf('contrib:') === 0) { state.contribution = a.slice(8); }
    else if (a.indexOf('alumni:') === 0) { state.alumni = a.slice(7); }
    else if (a === 'mgr') { state.mgrDone = suggestion()[1]; }
    else if (a === 'city') { state.cityDone = true; }
    else if (a === 'reset') { state = { screen: 1, stage: 'ehub', opened: false, registered: false, attended: false, contribution: null, alumni: null, mgrDone: null, cityDone: false }; }
    render();
    window.scrollTo(0, 0);
  });
  render();
</script>
</body>
</html>
